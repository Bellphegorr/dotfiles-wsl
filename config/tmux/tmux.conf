# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse
set -g mouse on

# Paste options
set -g set-clipboard on
set -g allow-passthrough all

# History
set -g history-limit 100000

# Divisions
bind | split-window -h
bind - split-window -v

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf

# Numbering starting at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on close
set -g renumber-windows on

# Matte Black theme, from the official Omarchy tmux.conf. ANSI colors only,
# painted by the terminal's scheme (blue=#e68e0d, brightblack=#8a8a8d).
# Continuum injects its save icon into status-right.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -g status-style "bg=default,fg=default"
# No bold: this terminal renders bold as the scheme's bright variant.
set -g status-left "#[fg=black,bg=blue] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
# Reset styles left by older configs (source-file does not clear options);
# the theme lives in the formats below and activity/bell keep tmux's native
# reverse so their cue stays visible, as in the official config.
setw -g window-status-style default
setw -g window-status-current-style default
setw -g window-status-activity-style reverse
setw -g window-status-bell-style reverse
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'off'
set -g @continuum-boot 'off'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

run '~/.config/tmux/plugins/tpm/tpm'
